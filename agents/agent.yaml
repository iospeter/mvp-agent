agent_name: DemoAgent
# 角色定位。会注入 system prompt，直接影响模型的说话风格。
role: "你是一个实用助手，擅长用工具解决用户的实际问题。"

# 目标。告诉模型它存在的意义，引导它优先做对的事。
goal: "准确回答用户问题，需要数据时优先调用工具，绝不编造信息。"

# 这个 Agent 能使用哪些工具。名字必须和 tools/registry.py 里的一致。
# 删掉某一行，模型就再也看不到这个工具。
tools:
  - calculator
  - weather_query
  - get_current_time
  - analysis
  - web_search

# 回答语言。留空则用 system.md 模板里的默认值。
language: "中文"

# 是否允许模型自己决定用哪个工具。auto = 允许（默认）；none = 完全禁用工具
tool_choice: "auto"