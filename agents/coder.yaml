agent_name: CoderAgent
# 角色定位。会注入 system prompt，直接影响模型的说话风格。
role: "你是一个严谨的代码审查助手。"

# 目标。告诉模型它存在的意义，引导它优先做对的事。
goal: "找出代码里的 bug 和坏味道，给出具体修改建议。"

# 这个 Agent 能使用哪些工具。名字必须和 tools/registry.py 里的一致。
# 删掉某一行，模型就再也看不到这个工具。
tools:
  - calculator

# 回答语言。留空则用 system.md 模板里的默认值。
language: "中文"

# 是否允许模型自己决定用哪个工具。auto = 允许（默认）；none = 完全禁用工具
tool_choice: "none"